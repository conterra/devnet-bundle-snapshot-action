name: devnet-bundle-snapshot-action
description: Devnet Bundle Snapshot Action

inputs:
  nexus_id:
    description: "Nexus ID"
    required: true
  nexus_user:
    description: "Nexus User"
    required: true
  nexus_user_pw:
    description: "Nexus User Password"
    required: true
  nexus_url:
    description: "Nexus Url"
    required: true
  nexus_url_release:
    description: "Nexus Url Release"
    required: true
  nexus_url_snapshots:
    description: "Nexus Url Snapshots"
    required: true
  release_token:
    description: "Release Token"
    required: true
  run_js_tests:
    description: "Run JS unit tests and publish results"
    required: false
    default: "true"
  run_end_to_end_tests:
    description: "Run Playwright e2e tests and publish results"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - id: checkout
      uses: actions/checkout@v4
    - id: cache-env
      name: Set browser caches into node_modules
      run: |
        echo "PUPPETEER_CACHE_DIR=${{ github.workspace }}/node_modules/.puppeteercache" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/node_modules/.playwrightcache" >> "$GITHUB_ENV"
      shell: bash
    - id: cache-maven
      name: Cache Maven repository
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: maven-v1-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-v1-${{ runner.os }}-
          maven-v1-
    - id: cache-node
      name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: |
          **/node_modules
          **/node
        key: npm-v1-${{ runner.os }}-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', '**/package-lock.json') }}
        restore-keys: |
          npm-v1-${{ runner.os }}-
          npm-v1-
    - id: setup
      name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'
    - id: create_settings_xml
      name: Create settings.xml
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        repositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        plugin_repositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        servers: >
          [
            {
              "id": "${{ inputs.nexus_id }}",
              "username": "${{ inputs.nexus_user }}",
              "password": "${{ inputs.nexus_user_pw }}"
            }
          ]
        mirrors: >
          [
            {
              "id": "${{ inputs.nexus_id }}",
              "mirrorOf": "central",
              "url": "${{ inputs.nexus_url }}"
            }
          ]
    - id: project_version
      name: Extract Maven project version
      run: |
        VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: build
      name: Build
      run: mvn prepare-package -B -ntp -Pinclude-mapapps-deps
      shell: bash
    - id: js_tests
      name: Run JS tests
      if: ${{ inputs.run_js_tests == 'true' }}
      run: mvn test -B -ntp -P include-mapapps-deps,run-js-tests -Dbuild.stage=test
      shell: bash
    - name: Publish JS test results
      if: ${{ always() && inputs.run_js_tests == 'true' }}
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'target/webapp/js/JS-TEST-REPORT-*.xml'
        check_name: 'JS Unit Tests'
    - id: e2e
      name: Run end-to-end tests
      if: ${{ inputs.run_end_to_end_tests == 'true' }}
      run: mvn test -B -ntp -P include-mapapps-deps,run-end-to-end-tests -Dbuild.stage=test
      shell: bash
      env:
        UPDATE_SNAPSHOTS: "false"
    - name: Publish e2e test results
      if: ${{ always() && inputs.run_end_to_end_tests == 'true' }}
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'target/end-to-end/junit.xml'
        check_name: 'End-to-end Tests'
    - name: Upload e2e artifacts
      if: ${{ always() && inputs.run_end_to_end_tests == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results
        path: target/end-to-end
        if-no-files-found: ignore
    - id: nexus_deployment
      name: Publish to Nexus
      if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      run: mvn clean deploy -U -B -ntp -Pcompress -Dmaven.test.skip.exec=true -Ddist.releases.id=${{ inputs.nexus_id }} -Ddist.releases.url=${{ inputs.nexus_url_release }} -Ddist.snapshots.id=${{ inputs.nexus_id }} -Ddist.snapshots.url=${{ inputs.nexus_url_snapshots }}
      shell: bash
    - id: project_artifact_id
      name: Extract Maven project artifactId
      if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      run: |
        ARTIFACT_ID=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.artifactId}' --non-recursive exec:exec)
        echo "artifactId=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: release
      name: Create GitHub release
      if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
      uses: ncipollo/release-action@v1
      with:
        artifacts: "target/${{ steps.project_artifact_id.outputs.artifactId }}-bundle.zip,target/${{ steps.project_artifact_id.outputs.artifactId }}-sample-app.zip"
        preRelease: true
        bodyFile: "RELEASE.md"
        allowUpdates: true
        replacesArtifacts: true
        tag: ${{ steps.project_version.outputs.version }}
        token: ${{ inputs.release_token }}
